date: "2026-06-08"

# CSV 轨迹数据文件路径
trajectory:
  csv_path: "data/csv/pos/hz_area.csv"
  coord_system: "gcj02"  # 中国 GPS 数据通常为 GCJ-02，需转换为 WGS-84

road_network:
  city: "杭州市"
  # overpass_endpoint: "https://overpass.kumi.systems/api/interpreter"  # 国内网络如官方不通可取消注释
  highway_types:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential

preprocess:
  min_speed_ms: 0.5
  max_jump_m: 500
  trip_gap_minutes: 5
  dp_epsilon_m: 10

matching:
  observation_sigma: 25   # GPS 观测噪声标准差 (米)，搜索半径 = 3x = 75m
  candidate_radius: 75
  max_workers: 8
  device_chunk_size: 200

stats:
  segment_length_m: 50

output:
  dir: "output"
  parquet: "roads_coverage.parquet"
  map: "coverage_map.html"
